<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <!-- 푸른 디지털 나무&B 심볼 그라디언트 -->
    <linearGradient id="treeGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0052D4;" />
      <stop offset="50%" style="stop-color:#4364F7;" />
      <stop offset="100%" style="stop-color:#00C9FF;" />
    </linearGradient>
    <!-- 상승하는 네온 화살표 그라디언트 -->
    <linearGradient id="arrowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00B4DB;" />
      <stop offset="100%" style="stop-color:#00FF87;" />
    </linearGradient>
  </defs>

  <!-- 테두리 없는 투명 배경 위에 배치 -->
  <g transform="translate(0, 1)">
    <!-- 뿌리와 하단 칩 모티브 기본 축 -->
    <path d="M24 54 L40 54 L36 46 L28 46 Z" fill="url(#treeGrad)" opacity="0.8"/>
    
    <!-- 메인 메디컬/디지털 트리 줄기 및 B 형상 -->
    <!-- 왼쪽 기둥(나무 둥치) -->
    <path d="M26 16 C26 16 22 30 22 48 L30 48 C30 35 29 24 32 16 Z" fill="url(#treeGrad)" />
    
    <!-- B의 오른쪽 상단 루프 (나뭇잎 결합) -->
    <path d="M28 16 C38 16 45 20 45 28 C45 35 38 37 28 37" fill="none" stroke="url(#treeGrad)" stroke-width="5.5" stroke-linecap="round" />
    
    <!-- B의 오른쪽 하단 루프 -->
    <path d="M28 37 C42 37 48 40 48 48 C48 54 38 55 28 55" fill="none" stroke="url(#treeGrad)" stroke-width="6" stroke-linecap="round" />
    
    <!-- 왼쪽 디지털 잎사귀 레이어 -->
    <path d="M23 38 C14 36 12 26 22 24 C20 16 30 14 31 20" fill="url(#arrowGrad)" opacity="0.9"/>
    
    <!-- 중앙을 가로질러 우상향하는 성장 화살표 (빅루트 비전) -->
    <path d="M16 44 C20 32 30 24 44 20" fill="none" stroke="url(#arrowGrad)" stroke-width="4.5" stroke-linecap="round" />
    <polygon points="42,13 52,21 43,27" fill="url(#arrowGrad)" />
    
    <!-- 테크 감성의 포인트 도트 노드 -->
    <circle cx="14" cy="26" r="2.5" fill="#00FF87" />
    <circle cx="44" cy="31" r="2" fill="#00C9FF" />
  </g>
</svg>
